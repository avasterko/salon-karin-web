    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://jypedwqbgsdfjadldyxi.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_3Stz2S3Dc0QXKbIKdEJrzA_5t2fFg-O";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

let aktualnyFilter = "vsetky";
let aktualnaKadernicka = "vsetky";


function nastavKadernicku(kadernicka) {

    aktualnaKadernicka = kadernicka;

    skontrolujPrihlasenie();

}

function nastavFilter(filter) {

    aktualnyFilter = filter;

    skontrolujPrihlasenie();

}
        async function skontrolujPrihlasenie() {

            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth.getSession();


            if (!session) {

                window.location.href =
                    "admin.html";

                return;

            }


       const { data, error } =
    await supabaseClient
        .from("reservations")
        .select("*")
        .order("reservation_date", {
            ascending: true
        })
        .order("reservation_time", {
            ascending: true
        });
console.log("REZERVACIE:", data);
console.log("CHYBA:", error);
if (error) {

    console.error("SUPABASE ERROR:", error);

    document.getElementById("obsah").innerText =
        "Nepodarilo sa načítať rezervácie.";

    return;
}


if (!data || data.length === 0) {

    document.getElementById("obsah").innerText =
        "Zatiaľ nemáš žiadne rezervácie.";

    return;
}

const dnesDatum =
    new Date()
        .toISOString()
        .split("T")[0];


const zajtraDatum =
    new Date();


zajtraDatum.setDate(
    zajtraDatum.getDate() + 1
);


const zajtraDatumString =
    zajtraDatum
        .toISOString()
        .split("T")[0];


const pocetDnes =
    data.filter(
        rezervacia =>
            rezervacia.reservation_date === dnesDatum
    ).length;


const pocetZajtra =
    data.filter(
        rezervacia =>
            rezervacia.reservation_date === zajtraDatumString
    ).length;


document.getElementById("pocetDnes").innerText =
    pocetDnes;


document.getElementById("pocetZajtra").innerText =
    pocetZajtra;


document.getElementById("pocetVsetky").innerText =
    data.length;
let zobrazeneRezervacie = data;


if (aktualnyFilter === "dnes") {

    const dnes =
        new Date()
            .toISOString()
            .split("T")[0];

    zobrazeneRezervacie =
        data.filter(
            rezervacia =>
                rezervacia.reservation_date === dnes
        );

}


if (aktualnyFilter === "zajtra") {

    const zajtra =
        new Date();

    zajtra.setDate(
        zajtra.getDate() + 1
    );

    const datumZajtra =
        zajtra
            .toISOString()
            .split("T")[0];

    zobrazeneRezervacie =
        data.filter(
            rezervacia =>
                rezervacia.reservation_date === datumZajtra
        );

} document.getElementById("obsah").innerHTML =

   zobrazeneRezervacie.map(rezervacia => `

        <div style="
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
        ">

            <strong>
                ${rezervacia.name}
            </strong>

            <br>

            📅 ${rezervacia.reservation_date}

            <br>

            🕐 ${rezervacia.reservation_time}

            <br>

            ✂️ ${rezervacia.service}

            <br>

            👩 ${rezervacia.kadernicka}

            <br>

            📞 ${rezervacia.phone}

            <br>

            📧 ${rezervacia.email}
<br>

<button
    onclick="zrusitRezervaciu('${rezervacia.id}')"
    style="
        margin-top: 10px;
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: #c62828;
        color: white;
        cursor: pointer;
    "
>
    ❌ Zrušiť rezerváciu
</button>
        </div>

    `).join(""); }


        async function zrusitRezervaciu(id) {

    const potvrdenie =
        confirm(
            "Naozaj chceš zrušiť túto rezerváciu?"
        );

    if (!potvrdenie) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("reservations")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(
            "SUPABASE ERROR:",
            error
        );

        alert(
            "Rezerváciu sa nepodarilo zrušiť."
        );

        return;
    }


    alert(
        "Rezervácia bola zrušená."
    );


    skontrolujPrihlasenie();

}async function odhlasit() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "admin.html";

        }


        skontrolujPrihlasenie();

    </script>
